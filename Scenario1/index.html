<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Cart</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 12px; }
  h2 { text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: center; border-bottom: 1px solid #ccc; }
  button { cursor: pointer; padding: 3px 9px; }
  .remove { background: #d9534f; color: #fff; border: none; border-radius: 3px; }
  #summary { text-align: right; margin-top: 16px; line-height: 1.7; }
  #empty { text-align: center; font-size: 18px; margin-top: 20px; }
</style>
</head>
<body>
<h2>Shopping Cart</h2>
<table id="cartTable">
  <thead>
    <tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr>
  </thead>
  <tbody id="cartBody"></tbody>
</table>
<div id="empty"></div>
<div id="summary"></div>

<script>
  // Array of objects
  var cart = [
    { name: "Notebook",     price: 120, qty: 1 },
    { name: "Pen Pack",     price: 60,  qty: 1 },
    { name: "Water Bottle", price: 350, qty: 1 }
  ];

  function increase(i) {
    cart[i].qty = cart[i].qty + 1;
    render();
  }

  function decrease(i) {
    if (cart[i].qty > 1) {      // quantity never goes below 1
      cart[i].qty = cart[i].qty - 1;
    }
    render();
  }

  function removeItem(i) {
    cart.splice(i, 1);          // delete item from array
    render();
  }

  function render() {
    var body = document.getElementById("cartBody");
    var html = "";
    var subtotal = 0;

    for (var i = 0; i < cart.length; i++) {
      var rowTotal = cart[i].price * cart[i].qty;
      subtotal += rowTotal;
      html += "<tr>" +
        "<td>" + cart[i].name + "</td>" +
        "<td>Rs. " + cart[i].price + "</td>" +
        "<td><button onclick='decrease(" + i + ")'>-</button> " +
          cart[i].qty +
          " <button onclick='increase(" + i + ")'>+</button></td>" +
        "<td>Rs. " + rowTotal + "</td>" +
        "<td><button class='remove' onclick='removeItem(" + i + ")'>Remove</button></td>" +
        "</tr>";
    }
    body.innerHTML = html;

    var empty = document.getElementById("empty");
    var summary = document.getElementById("summary");

    if (cart.length === 0) {
      document.getElementById("cartTable").style.display = "none";
      empty.innerText = "Your cart is empty.";
      summary.innerHTML = "";
      return;
    }

    document.getElementById("cartTable").style.display = "table";
    empty.innerText = "";

    var discount = 0;
    if (subtotal >= 1000) {
      discount = subtotal * 0.10;
    }
    var payable = subtotal - discount;

    summary.innerHTML =
      "Subtotal: Rs. " + subtotal.toFixed(2) + "<br>" +
      "Discount (10% on Rs. 1000+): Rs. " + discount.toFixed(2) + "<br>" +
      "<b>Amount payable: Rs. " + payable.toFixed(2) + "</b>";
  }

  render();
</script>
</body>
</html>
